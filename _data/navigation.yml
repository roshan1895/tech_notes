      - { title: Containers,          icon: "🐳", collection: containers,          status: soon }
      - { title: Linux,               icon: "🖥️", collection: linux,               status: soon }
      - { title: Networking,          icon: "🌐", collection: networking,          status: soon }
      - { title: DevOps,              icon: "⚙️",  collection: devops,              status: soon }
      - { title: Android,             icon: "📱", collection: android,             status: soon }
      - { title: Architecture,        icon: "🏗️", collection: architecture,        status: soon }
      - { title: Databases,           icon: "💾", collection: databases,           status: soon }
      - { title: Real Projects,       icon: "📝", collection: real-projects,       status: soon }
      - { title: Interview Questions, icon: "❓", collection: interview-questions, status: soon }
      - { title: Cheat Sheets,        icon: "📖", collection: cheatsheets,         status: soon }

  - group: Resources
