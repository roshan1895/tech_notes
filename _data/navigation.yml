# =============================================================================
#  Site navigation — single source of truth for the top nav and left sidebar.
#
#  Adding a section is a ONE-LINE change here. The sidebar (_includes/sidebar.html)
#  is multi-level: any item with a `collection` auto-lists that collection's docs
#  (sorted by nav_order) as collapsible children — no per-page nav maintenance.
#
#  Item fields:
#    title       Display label (required)
#    icon        Emoji shown in nav (falls back to a generic glyph)
#    collection  Jekyll collection -> links to /<collection>/, auto-lists children,
#                and marks active when page.section == collection
#    url         Explicit URL (use instead of `collection` for non-collection pages)
#    status      available | soon   (soon -> rendered disabled with a badge)
#    external    true for outbound links (opens in new tab)
# =============================================================================

# ---- Top navigation bar --------------------------------------------------
primary:
  - { title: Home,          url: /,                     icon: "🏠" }
  - { title: Docs,          url: /docs/,                icon: "📚" }
  - { title: Roadmaps,      url: /roadmaps/,            icon: "🧭" }
  - { title: Cheat Sheets,  url: /cheatsheets/,         icon: "📖" }

# ---- Left sidebar --------------------------------------------------------
