<!-- Search Modal -->
<div class="search-overlay" id="searchOverlay" onclick="if(event.target===this)closeSearch()">
  <div class="search-modal" role="dialog" aria-modal="true" aria-label="Search documentation">
    <div class="search-input-wrap">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6.5" cy="6.5" r="4.5"/><path d="M10 10l4 4" stroke-linecap="round"/></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Search titles, headings, code, tags…" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="searchResults" aria-autocomplete="list">
      <kbd class="search-esc">esc</kbd>
    </div>
    <div class="search-results" id="searchResults" role="listbox" aria-label="Search results">
      <div class="search-empty">Type to search across all documentation</div>
    </div>
    <div class="search-footer">
      <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
      <span><kbd>↵</kbd> open</span>
      <span><kbd>esc</kbd> close</span>
    </div>
  </div>
</div>
